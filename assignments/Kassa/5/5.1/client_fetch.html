<!doctype html>
<html>
<head><meta charset="utf-8"><title>5.1 CORS fetch demo</title></head>
<body>
  <h1>5.1 CORS fetch demo</h1>
  <p>This page lives on <strong>http://localhost:3000</strong> and will fetch JSON from http://localhost:4000</p>

  <button id="btn-blocked">Fetch blocked JSON (no CORS header)</button>
  <pre id="out-blocked"></pre>

  <button id="btn-allowed">Fetch allowed JSON (server sets Access-Control-Allow-Origin)</button>
  <pre id="out-allowed"></pre>

<script>
document.getElementById('btn-blocked').onclick = async () => {
  const out = document.getElementById('out-blocked');
  out.textContent = 'Requesting /favorites.json ...';
  try {
    const r = await fetch('http://localhost:4000/favorites.json');
    const data = await r.json();
    out.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    out.textContent = 'Error (expected): ' + e;
    console.error(e);
  }
};

document.getElementById('btn-allowed').onclick = async () => {
  const out = document.getElementById('out-allowed');
  out.textContent = 'Requesting /favorites-allow.json ...';
  try {
    const r = await fetch('http://localhost:4000/favorites-allow.json');
    const data = await r.json();
    out.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    out.textContent = 'Error: ' + e;
    console.error(e);
  }
};
</script>
</body>
</html>
