<!doctype html>
<html>
<head><meta charset="utf-8"><title>5.2 Custom headers demo</title></head>
<body>
  <h1>5.2 Custom headers demo</h1>
  <p>Requests to <code>http://localhost:4000/headers-block</code> and <code>/headers-allow</code></p>

  <button id="h-block">Request headers-block (blocked reading headers)</button>
  <pre id="out-block"></pre>

  <button id="h-allow">Request headers-allow (allowed reading headers)</button>
  <pre id="out-allow"></pre>

<script>
async function makeRequest(url) {
  const res = await fetch(url);
  const headersObj = {};
  ['x-cs533f25-Car','x-cs533f25-Ride','x-cs533f25-Gaming','x-cs533f25-Shop'].forEach(h => {
    headersObj[h] = res.headers.get(h);
  });
  return headersObj;
}

document.getElementById('h-block').onclick = async () => {
  const out = document.getElementById('out-block');
  out.textContent = 'Requesting /headers-block ...';
  try {
    const headers = await makeRequest('http://localhost:4000/headers-block');
    out.textContent = JSON.stringify(headers, null, 2);
  } catch (e) {
    out.textContent = 'Error: ' + e;
    console.error(e);
  }
};

document.getElementById('h-allow').onclick = async () => {
  const out = document.getElementById('out-allow');
  out.textContent = 'Requesting /headers-allow ...';
  try {
    const headers = await makeRequest('http://localhost:4000/headers-allow');
    out.textContent = JSON.stringify(headers, null, 2);
  } catch (e) {
    out.textContent = 'Error: ' + e;
    console.error(e);
  }
};
</script>
</body>
</html>
