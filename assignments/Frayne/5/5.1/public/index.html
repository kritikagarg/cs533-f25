<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
</head>
<body>
    <h1>CORS JSON Test</h1>
    <button onclick="fetchData()">Fetch JSON</button>
    <pre id="output"></pre>

    <script>
        document.getElementById("fetchData").onclick = async () => {
            try {
                const res = await fetch("http://localhost:4000/favorites");
                const data = await res.json();
                document.getElementById("output").textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                document.getElementById("output").textContent = "❌ Blocked by CORS: " + err;
            }
        };
    </script>
</body>
</html>
