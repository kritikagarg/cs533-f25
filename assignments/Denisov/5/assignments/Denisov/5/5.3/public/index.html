<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>5.3 CSP Embedding Demo</title>
  <style>
    body { font-family: sans-serif; }
    iframe { width: 100%; height: 500px; border: 1px solid #444; }
  </style>
</head>
<body>
  <h1>5.3 CSP: embedding remote site</h1>
  <p>This page tries to embed <code>https://archive.org</code> inside an iframe.</p>

  <iframe src="https://archive.org" title="archive.org iframe"></iframe>

  <p>
    When this file is served by <strong>server_allowed.js</strong> (no CSP), the iframe loads.<br>
    When the same file is served by <strong>server_blocked.js</strong> (with
    <code>Content-Security-Policy: frame-ancestors 'none'</code>), the iframe is blocked.
  </p>
</body>
</html>
