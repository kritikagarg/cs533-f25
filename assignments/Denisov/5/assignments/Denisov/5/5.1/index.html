<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>5.1 CORS Test</title>
</head>
<body>
  <h1>5.1 – CORS JSON Test</h1>

  <button onclick="loadData()">Load JSON</button>

  <pre id="output"></pre>

  <script>
    function loadData() {
      fetch("http://localhost:4001/data.json")
        .then(res => res.json())
        .then(data => {
          document.getElementById("output").textContent =
            JSON.stringify(data, null, 2);
        })
        .catch(err => {
          document.getElementById("output").textContent =
            "Error: " + err;
        });
    }
  </script>
</body>
</html>
